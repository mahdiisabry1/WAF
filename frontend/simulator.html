<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WAF MVP Simulator</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="title">
          <h1>Attack Simulator (MVP)</h1>
          <p class="sub">Send requests that should trigger the WAF rules.</p>
        </div>
        <nav class="nav">
          <a class="chip" href="/dashboard.html">Dashboard</a>
          <a class="chip" href="/simulator.html">Simulator</a>
          <span class="chip">Target: <span id="target" class="mono"></span></span>
        </nav>
      </header>

      <section class="grid">
        <div class="card span-6">
          <div class="muted small">Preset payloads</div>
          <div class="form" style="margin-top: 10px">
            <div class="field span-6">
              <label>Preset</label>
              <select id="preset">
                <option value="sqli">SQLi-ish (A03)</option>
                <option value="xss">XSS-ish (A03)</option>
                <option value="traversal">Path traversal (A07)</option>
                <option value="ssrf">SSRF-ish (A10)</option>
                <option value="benign">Benign</option>
              </select>
            </div>
            <div class="field span-6">
              <label>Route</label>
              <select id="route">
                <option value="/api/test/a03/search?q=">/api/test/a03/search?q=</option>
                <option value="/api/test/a07/file?name=">/api/test/a07/file?name=</option>
                <option value="/api/test/a10/fetch?url=">/api/test/a10/fetch?url=</option>
              </select>
            </div>
            <div class="field">
              <label>Payload</label>
              <input id="payload" class="mono" placeholder="will populate from preset" />
            </div>
            <div class="field">
              <div class="row">
                <button id="sendBtn">Send request</button>
                <button id="burstBtn">Burst x10</button>
                <a class="chip" href="/dashboard.html">Watch logs →</a>
              </div>
            </div>
          </div>
        </div>

        <div class="card span-6">
          <div class="row">
            <div>
              <div class="muted small">Response</div>
              <div class="small muted">Blocked requests return 403 with rule metadata.</div>
            </div>
            <button id="clearOutBtn">Clear</button>
          </div>
          <div id="out" class="callout logline" style="margin-top: 10px; min-height: 220px"></div>
        </div>
      </section>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const presets = {
        sqli: "1' OR 1=1 --",
        xss: "<img src=x onerror=alert(1)>",
        traversal: "../../etc/passwd",
        ssrf: "http://169.254.169.254/latest/meta-data/",
        benign: "hello-world",
      };

      const els = {
        preset: $("preset"),
        route: $("route"),
        payload: $("payload"),
        sendBtn: $("sendBtn"),
        burstBtn: $("burstBtn"),
        out: $("out"),
        clearOutBtn: $("clearOutBtn"),
        target: $("target"),
      };

      els.target.textContent = location.origin;

      function setPayloadFromPreset() {
        els.payload.value = presets[els.preset.value] ?? "";
      }

      function log(line) {
        els.out.textContent = `${line}\n\n${els.out.textContent}`.trim();
      }

      async function sendOnce() {
        const base = els.route.value;
        const payload = encodeURIComponent(els.payload.value ?? "");
        const url = `${base}${payload}`;

        const started = performance.now();
        let res, text;
        try {
          res = await fetch(url, { headers: { "x-sim": "1" } });
          text = await res.text();
        } catch (e) {
          log(`ERROR: ${String(e)}`);
          return;
        }
        const ms = Math.round(performance.now() - started);
        log(`${res.status} ${url} (${ms}ms)\n${text}`);
      }

      async function burst() {
        for (let i = 0; i < 10; i++) await sendOnce();
      }

      els.preset.addEventListener("change", setPayloadFromPreset);
      els.sendBtn.addEventListener("click", () => sendOnce());
      els.burstBtn.addEventListener("click", () => burst());
      els.clearOutBtn.addEventListener("click", () => (els.out.textContent = ""));

      setPayloadFromPreset();
    </script>
  </body>
</html>

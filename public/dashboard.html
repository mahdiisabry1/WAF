<!DOCTYPE html>
<html>
<head>
  <title>SOC Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: Arial; padding: 20px; }

    .filters {
      margin-bottom: 15px;
    }

    input, select {
      padding: 8px;
      margin-right: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
    }

    th {
      background: #222;
      color: white;
    }

    tr:nth-child(even) {
      background: #f2f2f2;
    }

    .grid {
      display: flex;
      gap: 20px;
    }

    .card {
      padding: 10px;
      background: #f5f5f5;
      flex: 1;
    }
  </style>
</head>

<body>

<h2>🛡️ SOC Security Dashboard</h2>

<!-- 🔍 Filters -->
<div class="filters">
  <input id="ipFilter" placeholder="Filter by IP">
  <select id="typeFilter">
    <option value="">All Types</option>
    <option value="SQL Injection">SQL Injection</option>
    <option value="XSS">XSS</option>
  </select>
  <button onclick="loadLogs()">Apply</button>
</div>

<!-- 📊 Stats -->
<div class="grid">
  <div class="card">
    <h3>Total Attacks</h3>
    <div id="total">0</div>
  </div>
  <div class="card">
    <h3>SQL Injection</h3>
    <div id="sql">0</div>
  </div>
  <div class="card">
    <h3>XSS</h3>
    <div id="xss">0</div>
  </div>
</div>

<!-- <canvas id="chart" height="50"></canvas> -->
<br><br><br>
<!-- 📋 Table -->
<table>
  <thead>
    <tr>
      <th>Time</th>
      <th>IP</th>
      <th>Method</th>
      <th>Endpoint</th>
      <th>Type</th>
    </tr>
  </thead>
  <tbody id="logTable"></tbody>
</table>

<script>
let chart;

async function loadStats() {
  const res = await fetch("http://localhost:3000/stats");
  const data = await res.json();

  document.getElementById("total").innerText = data.total;
  document.getElementById("sql").innerText = data.sql_injection;
  document.getElementById("xss").innerText = data.xss;

  renderChart(data);
}

function renderChart(data) {
  const ctx = document.getElementById("chart");

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: 'pie',
    data: {
      labels: ['SQL Injection', 'XSS'],
      datasets: [{
        data: [data.sql_injection, data.xss]
      }]
    }
  });
}

async function loadLogs() {
  const ipFilter = document.getElementById("ipFilter").value;
  const typeFilter = document.getElementById("typeFilter").value;

  const res = await fetch("http://localhost:3000/logs");
  let logs = await res.json();

  // 🔍 Filtering
  if (ipFilter) {
    logs = logs.filter(l => l.ip.includes(ipFilter));
  }

  if (typeFilter) {
    logs = logs.filter(l => l.attack_type === typeFilter);
  }

  const table = document.getElementById("logTable");
  table.innerHTML = "";

  logs.reverse().forEach(log => {
    table.innerHTML += `
      <tr>
        <td>${log.timestamp}</td>
        <td>${log.ip}</td>
        <td>${log.method}</td>
        <td>${log.endpoint}</td>
        <td>${log.attack_type}</td>
      </tr>
    `;
  });
}

// LIVE UPDATES
setInterval(() => {
  loadLogs();
  loadStats();
}, 3000);

// Initial load
loadLogs();
loadStats();

</script>

</body>
</html>
